# JARVIS agents — this file holds NO secrets (API keys go in ../.env).
#
# Cost rule: COST_MODE comes only from the environment and defaults to FREE_ONLY.
# This file cannot change it. Agents with cost_class = "paid" stay blocked unless
# COST_MODE=ALLOW_PAID *and* the agent sets allow_paid = true.
#
# Ranking (see backend/jarvis/core/router.py):
#   priority      0..100, higher wins
#   quality       per task (chat, code, math, research), 0..1. Tasks left out use
#                 the capabilities: 0.6 if the agent has that capability, else 0.2.
#   capabilities  chat, code, math, reasoning, research, vision
# Limits:
#   daily_limit   requests/day (counted locally and persisted in data/jarvis.db)
#   rpm_limit     requests/minute (respected locally, before the provider says 429)
#   quota_group   agents that share one provider quota share these counters
# Quota headers sent by the provider (remaining/reset) always take precedence.

# Seconds between background health checks in `jarvis chat` (no quota spent).
health_interval = 120

# ---------------------------------------------------------------------------
# OpenCode Zen (free models), through the official client in a locked sandbox.
# Only names ending in "-free" (or big-pickle) with price 0 on every tier are
# used. The free list changes often: `jarvis status` shows what is offered now.
# Models marked "trial use only" by their provider (e.g. Nemotron) are left out.
# ---------------------------------------------------------------------------
[opencode]
enabled = true
binary = "opencode"
timeout = 120

[[opencode.models]]
id = "space-bunny-free"
name = "OpenCode · Space Bunny (zero retention)"
priority = 70
privacy = "zero_retention"
capabilities = ["chat", "code", "math", "reasoning", "research"]
quality = { chat = 0.8, code = 0.8, math = 0.7, research = 0.6 }

[[opencode.models]]
id = "longcat-2.5-preview-free"
name = "OpenCode · LongCat 2.5 (zero retention)"
priority = 65
privacy = "zero_retention"
capabilities = ["chat", "code", "reasoning", "research"]
quality = { chat = 0.8, code = 0.7, math = 0.6, research = 0.7 }

[[opencode.models]]
id = "big-pickle"
name = "OpenCode · Big Pickle"
priority = 55
privacy = "may_train"
capabilities = ["chat", "code", "reasoning"]
quality = { chat = 0.7, code = 0.8 }

[[opencode.models]]
id = "exo-free"
name = "OpenCode · Exo"
priority = 50
privacy = "may_train"
capabilities = ["chat", "code", "reasoning"]

[[opencode.models]]
id = "mimo-v2.6-flash-free"
name = "OpenCode · MiMo V2.6 Flash"
priority = 45
privacy = "may_train"
capabilities = ["chat", "code"]

# ---------------------------------------------------------------------------
# OpenAI-compatible providers. Each one stays "unconfigured" until its key is
# in .env. Accounts must be on the FREE plan with NO payment method on file.
# ---------------------------------------------------------------------------

# Groq free plan: no card, ~30 req/min and ~1,000 req/day per model (resets).
# Never upgrade to the Developer plan (it requires a card).
[[openai_compat]]
