[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS — multi-agent personal assistant that only uses free AI agents"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
server = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "websockets==17.2",
]
local = [
    "mlx-lm==0.32.0",  # Apple Silicon only
]
voice = [
    "numpy==2.5.3",
    "sounddevice==0.5.6",
    "pywhispercpp==1.5.1",
    "piper-tts==1.8.0",
]
dev = [
    "httpx2==2.13.1",  # Starlette's TestClient
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "ruff==0.16.10",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: calls a real (free) AI agent; skipped unless JARVIS_LIVE_TESTS=1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
