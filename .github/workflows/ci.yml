# Continuous integration: lint, tests and build on every push and pull request.
# Free: the repository is public, and GitHub-hosted runners are free for public repos.
# No secrets are used, and the workflow can only read the repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install (server + dev; voice, local AI and wake word are macOS/optional extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,dev]" "numpy==2.5.3"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        # macOS-only tests (sandbox-exec, say, MLX) skip themselves on Linux.
        run: pytest -q --cov=jarvis --cov-report=term

  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high
