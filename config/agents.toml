# Cloudflare Workers AI, Workers Free plan: 10,000 Neurons/day, reset at 00:00 UTC.
# Above the free allowance requests FAIL instead of billing (official docs).
# Small models use fewer Neurons, so more answers fit in the daily allowance.
[[openai_compat]]
id = "cloudflare:llama-3.1-8b"
name = "Cloudflare · Llama 3.1 8B"
provider = "cloudflare"
base_url = "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1"
model = "@cf/meta/llama-3.1-8b-instruct"
api_key_env = "CLOUDFLARE_API_TOKEN"
cost_class = "free_with_limits"
health_check = "key"
priority = 35
privacy = "unknown"
capabilities = ["chat"]
quality = { chat = 0.5, code = 0.3 }

# ---------------------------------------------------------------------------
# Voice (local and free). Models are downloaded once into data/models.
#   STT: whisper.cpp; "large-v3-turbo-q5_0" (~550 MB) is accurate in Portuguese.
#        Smaller/faster: "small-q5_1" (~180 MB), "base-q5_1" (~60 MB).
#   TTS: "say" (macOS built-in, zero setup) or "piper" (open source, ~60 MB voice).
#   `say -v '?' | grep pt_BR` lists the macOS Portuguese voices.
# ---------------------------------------------------------------------------
[voice]
language = "pt"
stt_model = "large-v3-turbo-q5_0"
tts_engine = "say"
say_voice = "Luciana"
piper_voice = "pt_BR-faber-medium"
silence_ms = 900           # quiet time that ends your turn
no_speech_timeout = 8      # seconds of waiting before listening again
# Wake word ("Hey Jarvis", English pronunciation): `jarvis voice --wake` or the
# "Ativar por Hey Jarvis" switch. openWakeWord runs locally (~9 MB of models, downloaded
# once); the pretrained hey_jarvis model is CC BY-NC-SA 4.0 (personal use only).
# Raise wake_threshold if it wakes up by mistake; lower it if it does not hear you.
wake_word_model = "hey_jarvis_v0.1"
wake_threshold = 0.5
stop_phrases = ["tchau jarvis", "encerrar conversa", "pode parar jarvis", "desligar jarvis"]  # "xau" also works

# ---------------------------------------------------------------------------
# Memory (data/memory.db, local only)
#   History: every conversation is saved and can be reopened.
#   Short-term: the last `window` messages go to the agent; older ones become a
#               summary (one free agent call per 10 messages that leave the window).
#   Long-term: facts you ask JARVIS to remember ("JARVIS, lembre que ...").
#              share_facts_with = "private" sends them only to local and
#              zero-retention agents; "all" sends them to every agent.
# ---------------------------------------------------------------------------
[memory]
enabled = true
share_facts_with = "private"
summarize = true
window = 20

# ---------------------------------------------------------------------------
# Tools (Phase 7). Every call goes through policy → confirmation → limits → audit
# (data/audit.db). See `jarvis tools list` and `jarvis tools log`.
#   calculator, current_time                 safe, allowed
#   wikipedia                                allowed (your query goes to wikipedia.org)
#   fetch_url                                asks first (public sites only, no local network)
#   add_task, list_tasks, complete_task      allowed; delete_task asks first
#   list_dir, read_file                      only inside allowed_dirs; read_file asks first
#   run_python                               ALWAYS asks; macOS sandbox: no files, no network
# After a web page or file was read, any sensitive tool asks first (prompt injection guard).
# ---------------------------------------------------------------------------
[tools]
enabled = true
max_steps = 4
max_calls_per_minute = 20
allowed_dirs = []        # e.g. ["~/Documents/notas"]
policies = {}            # e.g. { fetch_url = "allow", run_python = "deny" }

# ---------------------------------------------------------------------------
# Local AI (Phase 8): runs on this Mac with MLX-LM, offline and free.
# Download the model once:  jarvis local download   (~2.3 GB, Apache-2.0)
# Low priority: the free online agents answer first; the local model takes over when
# they are unavailable (no internet, quotas used up). `jarvis chat --local` (or the
# "só local" switch in the web interface) uses ONLY this model: nothing leaves the Mac.
# ---------------------------------------------------------------------------
[local]
enabled = true
model = "mlx-community/Qwen3-4B-Instruct-2507-4bit"
priority = 30
context_window = 32768
max_tokens = 1024
idle_minutes = 10     # unload the model (frees ~3 GB of RAM) after this idle time
