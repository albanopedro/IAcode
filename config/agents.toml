base_url = "https://api.groq.com/openai/v1"
model = "openai/gpt-oss-120b"
api_key_env = "GROQ_API_KEY"
cost_class = "free_with_limits"
daily_limit = 1000
rpm_limit = 30
context_window = 131072
priority = 60
privacy = "unknown"
capabilities = ["chat", "code", "math", "reasoning"]
quality = { chat = 0.7, code = 0.8, math = 0.8 }

[[openai_compat]]
id = "groq:qwen3.8-27b"
name = "Groq · Qwen 3.8 27B"
provider = "groq"
base_url = "https://api.groq.com/openai/v1"
model = "qwen/qwen3.8-27b"
api_key_env = "GROQ_API_KEY"
cost_class = "free_with_limits"
daily_limit = 1000
rpm_limit = 30
priority = 55
